name: Compilar FlipFont APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e Licencas
        run: |
          # Adiciona as ferramentas do Android ao PATH
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          # Aceita todas as licencas pendentes
          yes | sdkmanager --licenses || true
          # Instala a plataforma do Android 15
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.9 Oficial
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK (Debug)
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: FlipFont-Ubuntu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
